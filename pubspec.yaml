name: rasikh
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+6

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter

  # -------------------------------------------
  # iOS-style Icons
  # -------------------------------------------
  cupertino_icons:
  awesome_dialog:

  # -------------------------------------------
  # PDF and File Utilities
  # -------------------------------------------
  pdf: ^3.11.3
  open_file: ^3.5.10
  shared_preferences: ^2.3.0
  google_fonts:
  webview_flutter:
  file_picker:
  app_settings: ^5.1.1

  # -------------------------------------------
  # Localization & Dependency Injection
  # -------------------------------------------
  easy_localization: ^3.0.3
  flutter_secure_storage:
  get_it: ^7.7.0
  event_bus: ^2.0.1

  # -------------------------------------------
  # Audio / Video / Communication
  # -------------------------------------------
  audioplayers: ^6.1.0
  agora_rtc_engine: 6.5.4
  agora_chat_sdk: 1.3.3
  record: ^6.2.1
  just_audio: ^0.10.5

  # -------------------------------------------
  # Data Structures & Functional Programming
  # -------------------------------------------
  equatable: ^2.0.7
  dartz: ^0.10.1
  uuid: ^4.0.0

  # -------------------------------------------
  # UI Utilities & Network
  # -------------------------------------------
  shimmer_animation:
  size_config: ^2.0.3
  dio: ^5.4.0
  path_provider: ^2.1.2
  animate_do: ^3.3.4
  carousel_slider: ^5.0.0
  smooth_page_indicator: ^1.2.0+3
  flutter_staggered_animations: ^1.0.0

  # -------------------------------------------
  # Connectivity Utilities
  # -------------------------------------------
  connectivity_plus: ^6.1.0
  internet_connection_checker: ^1.0.0
  dio_adapter: ^1.7.0

  # -------------------------------------------
  # Custom UI Components
  # -------------------------------------------
  custom_pop_up_menu: ^1.2.4

  # -------------------------------------------
  # State Management (BLoC)
  # -------------------------------------------
  flutter_bloc: ^8.1.3
  hydrated_bloc: ^9.1.3

  # -------------------------------------------
  # Widget Libraries
  # -------------------------------------------
  flutter_svg: ^2.0.9
  pin_code_fields: ^8.0.1
  crop_your_image: ^0.7.5
  image_picker: ^1.0.7
  separated_column: ^3.0.3
  separated_row: ^3.0.3
  cached_network_image: ^3.3.1
  expandable: ^5.0.1
  shimmer: ^3.0.0
  lottie: ^3.0.0
  auto_animated: ^3.2.0
  flutter_animate: ^4.5.0
  dots_indicator: ^3.0.0
  convex_bottom_bar: ^3.2.0
  animated_notch_bottom_bar: ^1.0.3

  # -------------------------------------------
  # Phone / Country / Layout
  # -------------------------------------------
  intl_phone_number_input: ^0.7.4
  country_picker: ^2.0.26
  gap: ^3.0.1

  # -------------------------------------------
  # Networking and Logging
  # -------------------------------------------
  pretty_dio_logger: ^1.3.1
  logger: ^2.4.0

  # -------------------------------------------
  # Additional UI & Utilities
  # -------------------------------------------
  flutter_rating_bar: ^4.0.0
  url_launcher: ^6.3.0
  package_info_plus: ^8.1.0
  timezone: ^0.9.0
  permission_handler: ^11.3.1
  loading_animation_widget: ^1.2.1
  dotted_border: ^2.1.0

  # -------------------------------------------
  # Maps and Geocoding
  # -------------------------------------------
  google_maps_flutter: ^2.9.0
  geocoding: ^3.0.0
  geolocator: ^9.0.2

  # -------------------------------------------
  # UI Controls and Animations
  # -------------------------------------------
  dropdown_button2: ^2.3.9
  animated_text_kit: ^4.2.2
  page_transition: ^2.0.9

  # -------------------------------------------
  # App / Project Utilities
  # -------------------------------------------
  rename: ^3.0.2

  # -------------------------------------------
  # HTML / Rich Text
  # -------------------------------------------
  #
  # Keep these versions compatible with the
  # existing Dart / Flutter setup.
  #
  flutter_html: ^3.0.0
  html: 0.15.6

  # -------------------------------------------
  # Rive
  # -------------------------------------------
  #
  # Keep the known-working version.
  #
  rive: ^0.13.9

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/langs/
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assets/anims/

  fonts:
    - family: almarai
      fonts:
        - asset: assets/fonts/almaria/Almarai-Regular.ttf
          weight: 400
          style: normal

        - asset: assets/fonts/almaria/Almarai-Bold.ttf
          weight: 800
          style: normal

        - asset: assets/fonts/almaria/Almarai-Light.ttf
          weight: 300
          style: normal

    - family: Abel
      fonts:
        - asset: assets/fonts/taja/Tajawal-Black.ttf
          weight: 900

        - asset: assets/fonts/taja/Tajawal-ExtraBold.ttf
          weight: 800

        - asset: assets/fonts/taja/Tajawal-Bold.ttf
          weight: 700

        - asset: assets/fonts/taja/Tajawal-Medium.ttf
          weight: 500

        - asset: assets/fonts/taja/Tajawal-Regular.ttf
          weight: 400

        - asset: assets/fonts/taja/Tajawal-Light.ttf
          weight: 300

        - asset: assets/fonts/taja/Tajawal-ExtraLight.ttf
          weight: 200